<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Booking Widget Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#F59E0B",
                        "primary-gradient-start": "#FBBF24",
                        "primary-gradient-end": "#D97706",
                        "background-dark": "#020617", // slate-950
                        "card-dark": "#0f172a", // slate-900
                        "card-selected": "#1e293b", // slate-800
                        "step-inactive": "#475569", // slate-600
                        "step-label-inactive": "#64748B", // slate-500
                        "connector-inactive": "#334155", // slate-700
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { 
                        "xl": "1rem", 
                        "2xl": "1.5rem" 
                    },
                },
            },
        }
    </script>
<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-black font-display flex items-center justify-center min-h-screen p-4 bg-cover bg-center bg-no-repeat relative">
<div class="absolute inset-0 z-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1601362840469-51e4d8d58785?q=80&amp;w=2070&amp;auto=format&amp;fit=crop')] bg-cover bg-center"></div>
<div class="absolute inset-0 z-0 bg-background-dark/90 backdrop-blur-sm"></div>
<div class="relative z-10 w-full max-w-[420px] h-[850px] max-h-[92vh] bg-background-dark rounded-[16px] shadow-2xl overflow-hidden flex flex-col border border-white/10 ring-1 ring-white/5">
<header class="bg-background-dark/95 backdrop-blur border-b border-white/5 sticky top-0 z-30 flex flex-col items-center justify-center h-[80px] px-6 relative">
<div class="absolute top-0 left-0 w-full flex items-center justify-between px-6 py-3">
<div class="flex items-center gap-2">
<span class="text-[18px] font-bold text-white tracking-tight">🚙 Detailing Pro</span>
</div>
<button class="text-white/60 hover:text-white transition-colors">
<span class="material-symbols-outlined text-xl">close</span>
</button>
</div>
<div class="mt-6 mb-1 text-[14px] text-gray-400 font-medium">
                Reservá tu turno
            </div>
<div class="flex items-center justify-center w-full max-w-[280px] relative">
<div class="absolute top-1/2 left-0 w-full h-[2px] bg-connector-inactive -z-10 -translate-y-1/2"></div>
<div class="absolute top-1/2 left-0 w-[0%] h-[2px] bg-primary -z-10 -translate-y-1/2 transition-all duration-300 ease-in-out"></div>
<div class="flex justify-between w-full items-center">
<div class="flex flex-col items-center gap-1.5 cursor-pointer relative">
<div class="absolute w-[18px] h-[18px] rounded-full border border-primary/30 bg-transparent animate-pulse"></div>
<div class="w-[10px] h-[10px] rounded-full bg-primary shadow-[0_0_15px_rgba(245,158,11,0.6)] z-10 transition-all duration-300"></div>
<span class="text-[11px] font-medium text-primary transition-colors duration-300 absolute mt-4">Vehículo</span>
</div>
<div class="flex flex-col items-center gap-1.5 cursor-pointer group">
<div class="w-[10px] h-[10px] rounded-full bg-step-inactive transition-all duration-300"></div>
<span class="text-[11px] font-medium text-step-label-inactive transition-colors duration-300 absolute mt-4">Servicio</span>
</div>
<div class="flex flex-col items-center gap-1.5 cursor-pointer group">
<div class="w-[10px] h-[10px] rounded-full bg-step-inactive transition-all duration-300"></div>
<span class="text-[11px] font-medium text-step-label-inactive transition-colors duration-300 absolute mt-4">Fecha</span>
</div>
</div>
</div>
</header>
<div class="px-6 pt-8 pb-4">
<h2 class="text-white text-[20px] font-bold">1. Seleccioná tu vehículo</h2>
</div>
<main class="flex-1 overflow-y-auto hide-scrollbar px-6 pb-8">
<div class="grid grid-cols-2 gap-4">
<label class="group relative flex flex-col items-center justify-center p-6 rounded-[16px] border border-white/10 bg-card-dark hover:bg-white/5 cursor-pointer transition-all duration-200 active:scale-[0.98] h-[180px]">
<input class="peer sr-only" name="vehicle" type="radio" value="citycar"/>
<div class="absolute inset-0 rounded-[16px] border-2 border-transparent peer-checked:border-primary peer-checked:bg-card-selected transition-all"></div>
<div class="relative z-10 flex flex-col items-center gap-3 text-center">
<div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center text-white/80 group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">directions_car</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-white font-bold text-[16px]">Citycar</span>
<span class="text-white/40 text-[12px] font-medium bg-white/5 px-2 py-0.5 rounded-full">x1.0</span>
</div>
</div>
</label>
<label class="group relative flex flex-col items-center justify-center p-6 rounded-[16px] border border-primary bg-card-selected cursor-pointer transition-all duration-200 active:scale-[0.98] h-[180px] ring-1 ring-primary/20 shadow-[0_0_20px_rgba(245,158,11,0.1)]">
<input checked="" class="peer sr-only" name="vehicle" type="radio" value="sedan"/>
<div class="absolute inset-0 rounded-[16px] border-2 border-primary peer-checked:border-primary peer-checked:bg-card-selected transition-all"></div>
<div class="relative z-10 flex flex-col items-center gap-3 text-center">
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center text-primary transition-colors">
<span class="material-symbols-outlined text-[32px]">minor_crash</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-white font-bold text-[16px]">Sedan</span>
<span class="text-primary text-[12px] font-bold bg-primary/10 px-2 py-0.5 rounded-full">x1.1</span>
</div>
</div>
</label>
<label class="group relative flex flex-col items-center justify-center p-6 rounded-[16px] border border-white/10 bg-card-dark hover:bg-white/5 cursor-pointer transition-all duration-200 active:scale-[0.98] h-[180px]">
<input class="peer sr-only" name="vehicle" type="radio" value="suv"/>
<div class="absolute inset-0 rounded-[16px] border-2 border-transparent peer-checked:border-primary peer-checked:bg-card-selected transition-all"></div>
<div class="relative z-10 flex flex-col items-center gap-3 text-center">
<div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center text-white/80 group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">airport_shuttle</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-white font-bold text-[16px]">SUV</span>
<span class="text-white/40 text-[12px] font-medium bg-white/5 px-2 py-0.5 rounded-full">x1.3</span>
</div>
</div>
</label>
<label class="group relative flex flex-col items-center justify-center p-6 rounded-[16px] border border-white/10 bg-card-dark hover:bg-white/5 cursor-pointer transition-all duration-200 active:scale-[0.98] h-[180px]">
<input class="peer sr-only" name="vehicle" type="radio" value="pickup"/>
<div class="absolute inset-0 rounded-[16px] border-2 border-transparent peer-checked:border-primary peer-checked:bg-card-selected transition-all"></div>
<div class="relative z-10 flex flex-col items-center gap-3 text-center">
<div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center text-white/80 group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">local_shipping</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-white font-bold text-[16px]">Pickup</span>
<span class="text-white/40 text-[12px] font-medium bg-white/5 px-2 py-0.5 rounded-full">x1.5</span>
</div>
</div>
</label>
</div>
</main>
</div>

</body></html>
