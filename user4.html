<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cliente Booking Widget Mobile - Paso 4</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#F59E0B", 
                        "primary-gradient-start": "#FBBF24",
                        "primary-gradient-end": "#D97706",
                        "background-dark": "#020617", 
                        "card-dark": "#0f172a", 
                        "card-selected": "#1e293b", 
                        "step-inactive": "#475569",
                        "text-inactive": "#64748B",
                        "connector-inactive": "#334155",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { 
                        "xl": "1rem", 
                        "2xl": "1.5rem" 
                    },
                },
            },
        }
    </script>
<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .step-glow {
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-black font-display flex items-center justify-center min-h-screen p-4 bg-cover bg-center bg-no-repeat relative">
<div class="absolute inset-0 z-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1601362840469-51e4d8d58785?q=80&amp;w=2070&amp;auto=format&amp;fit=crop')] bg-cover bg-center"></div>
<div class="absolute inset-0 z-0 bg-background-dark/90 backdrop-blur-sm"></div>
<div class="relative z-10 w-full max-w-[420px] h-[850px] max-h-[92vh] bg-background-dark rounded-[16px] shadow-2xl overflow-hidden flex flex-col border border-white/10 ring-1 ring-white/5">
<header class="bg-background-dark/95 backdrop-blur border-b border-white/5 relative z-30 flex flex-col" style="height: 140px;">
<div class="flex items-center justify-between px-6 pt-4 h-[50px]">
<div class="flex items-center gap-2">
<span class="text-xl">🚙</span>
<h1 class="text-white font-bold text-lg tracking-tight">Detailing Pro</h1>
</div>
<button class="text-white/60 hover:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<div class="text-center -mt-1">
<h2 class="text-white font-semibold text-sm">Reservá tu turno</h2>
</div>
<div class="px-8 mt-4 w-full">
<div class="relative flex items-center justify-between w-full">
<div class="absolute top-1/2 left-0 w-full -translate-y-1/2 h-[2px] bg-connector-inactive z-0"></div>
<div class="absolute top-1/2 left-0 -translate-y-1/2 h-[2px] bg-primary z-0 transition-all duration-300" style="width: 75%;"></div>
<div class="relative z-10 flex flex-col items-center gap-1.5 cursor-pointer group">
<div class="w-2.5 h-2.5 rounded-full bg-primary transition-all duration-300"></div>
<span class="text-[10px] sm:text-[11px] font-medium text-primary transition-colors duration-300 absolute -bottom-5 w-max">Veh</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-1.5 cursor-pointer group">
<div class="w-2.5 h-2.5 rounded-full bg-primary transition-all duration-300"></div>
<span class="text-[10px] sm:text-[11px] font-medium text-primary transition-colors duration-300 absolute -bottom-5 w-max">Serv</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-1.5 cursor-pointer group">
<div class="w-2.5 h-2.5 rounded-full bg-primary transition-all duration-300"></div>
<span class="text-[10px] sm:text-[11px] font-medium text-primary transition-colors duration-300 absolute -bottom-5 w-max">Fecha</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-1.5">
<div class="w-2.5 h-2.5 rounded-full bg-primary step-glow transition-all duration-300 transform scale-110"></div>
<span class="text-[10px] sm:text-[11px] font-medium text-primary transition-colors duration-300 absolute -bottom-5 w-max">Datos</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-1.5">
<div class="w-2.5 h-2.5 rounded-full bg-step-inactive transition-all duration-300"></div>
<span class="text-[10px] sm:text-[11px] font-medium text-text-inactive transition-colors duration-300 absolute -bottom-5 w-max">OK</span>
</div>
</div>
</div>
</header>
<main class="flex-1 overflow-y-auto hide-scrollbar p-6 space-y-6 pb-32 pt-4">
<div class="animate-fade-in">
<div class="mb-4">
<h2 class="text-white text-xl font-bold">4. Tus datos</h2>
<p class="text-white/50 text-xs mt-1">Necesitamos tu info para confirmar la reserva</p>
</div>
<div class="bg-card-dark border border-white/10 rounded-[16px] p-6 space-y-5">
<div class="space-y-2">
<label class="block text-sm font-medium text-white" for="fullname">Nombre Completo <span class="text-primary">*</span></label>
<input class="w-full h-12 bg-background-dark border border-white/10 rounded-xl px-4 text-white placeholder-white/20 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="fullname" placeholder="Juan Pérez" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-white" for="whatsapp">WhatsApp <span class="text-primary">*</span></label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/40 material-symbols-outlined text-xl">chat</span>
<input class="w-full h-12 bg-background-dark border border-red-500 rounded-xl pl-12 pr-4 text-white placeholder-white/20 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="whatsapp" placeholder="+54 9 351 123 4567" type="tel" value="123"/>
</div>
<p class="text-xs text-red-500 font-medium mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-sm">error</span>
                            Número inválido. Revisá el formato.
                        </p>
</div>
<div class="h-px bg-white/5 w-full my-2"></div>
<p class="text-xs font-medium text-white/40 uppercase tracking-wider">Detalles opcionales</p>
<div class="space-y-2">
<label class="block text-sm font-medium text-white/80" for="plate">Patente (Opcional)</label>
<input class="w-full h-12 bg-background-dark border border-white/10 rounded-xl px-4 text-white placeholder-white/20 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors uppercase" id="plate" placeholder="AA 123 BB" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-sm font-medium text-white/80" for="make">Marca</label>
<input class="w-full h-12 bg-background-dark border border-white/10 rounded-xl px-4 text-white placeholder-white/20 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="make" placeholder="Toyota" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-white/80" for="model">Modelo</label>
<input class="w-full h-12 bg-background-dark border border-white/10 rounded-xl px-4 text-white placeholder-white/20 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="model" placeholder="Corolla" type="text"/>
</div>
</div>
</div>
</div>
</main>
<footer class="absolute bottom-0 w-full bg-background-dark/95 backdrop-blur-md border-t border-white/10 p-6 z-40">
<button class="w-full bg-gradient-to-r from-primary-gradient-start to-primary-gradient-end disabled:from-gray-700 disabled:to-gray-800 disabled:text-white/20 disabled:shadow-none hover:brightness-110 text-background-dark font-bold text-lg py-4 px-6 rounded-[16px] shadow-[0_8px_20px_-5px_rgba(245,158,11,0.4)] active:scale-[0.98] transition-all flex items-center justify-center gap-3" disabled="">
<span>Continuar</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<p class="text-center text-[10px] text-white/30 mt-3 font-medium">Al continuar aceptas nuestros términos y condiciones.</p>
</footer>
</div>

</body></html>
