<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Confirmación de Reserva Exitosa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#F59E0B", 
                        "primary-gradient-start": "#FBBF24",
                        "primary-gradient-end": "#D97706",
                        "background-dark": "#020617", // slate-950
                        "card-dark": "#0f172a", // slate-900
                        "success": "#22c55e", // green-500
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { 
                        "xl": "1rem", 
                        "2xl": "1.5rem" 
                    },
                },
            },
        }
    </script>
<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-black font-display flex items-center justify-center min-h-screen p-4 bg-cover bg-center bg-no-repeat relative">
<div class="absolute inset-0 z-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1601362840469-51e4d8d58785?q=80&amp;w=2070&amp;auto=format&amp;fit=crop')] bg-cover bg-center"></div>
<div class="absolute inset-0 z-0 bg-background-dark/95 backdrop-blur-sm"></div>
<div class="relative z-10 w-full max-w-[420px] h-[850px] max-h-[92vh] bg-background-dark rounded-[16px] shadow-2xl overflow-hidden flex flex-col items-center justify-center border border-white/10 ring-1 ring-white/5 p-8">
<div class="flex flex-col items-center justify-center w-full h-full text-center space-y-8">
<div class="relative flex items-center justify-center mb-4">
<div class="absolute w-28 h-28 bg-success/20 rounded-full blur-xl animate-pulse"></div>
<div class="w-24 h-24 bg-success rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(34,197,94,0.4)] animate-pop z-10">
<span class="material-symbols-outlined text-white text-5xl font-bold">check</span>
</div>
</div>
<div class="space-y-3 animate-slide-up delay-100">
<h1 class="text-white text-3xl font-bold tracking-tight">¡Reserva Confirmada!</h1>
<p class="text-white/50 text-sm font-medium px-4">Te contactaremos por WhatsApp para confirmar los detalles.</p>
</div>
<div class="w-full animate-slide-up delay-200">
<div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-[20px] p-6 space-y-5 shadow-lg relative overflow-hidden group">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
<div class="flex items-center justify-between border-b border-white/10 pb-4">
<div class="flex flex-col items-start">
<span class="text-white/40 text-xs uppercase tracking-wider font-semibold mb-1">Fecha</span>
<div class="flex items-center gap-2 text-white">
<span class="material-symbols-outlined text-primary text-xl">calendar_today</span>
<span class="font-semibold text-lg">Lunes 10 de Feb</span>
</div>
</div>
</div>
<div class="flex items-center justify-between border-b border-white/10 pb-4">
<div class="flex flex-col items-start">
<span class="text-white/40 text-xs uppercase tracking-wider font-semibold mb-1">Hora</span>
<div class="flex items-center gap-2 text-white">
<span class="material-symbols-outlined text-primary text-xl">schedule</span>
<span class="font-semibold text-lg">09:00 AM</span>
</div>
</div>
</div>
<div class="flex flex-col items-center pt-1">
<span class="text-white/40 text-xs uppercase tracking-wider font-semibold mb-1">Total Estimado</span>
<span class="text-primary text-3xl font-black tracking-tight">$35.000</span>
</div>
</div>
</div>
<div class="w-full space-y-4 pt-4 animate-slide-up delay-300">
<button class="w-full bg-gradient-to-r from-primary-gradient-start to-primary-gradient-end hover:brightness-110 text-background-dark font-bold text-lg py-4 px-6 rounded-[16px] shadow-[0_8px_20px_-5px_rgba(245,158,11,0.4)] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Hacer otra reserva</span>
</button>
<a class="block text-white/50 hover:text-white text-sm font-medium transition-colors p-2" href="#">
                    Volver al inicio
                </a>
</div>
</div>
</div>

</body></html>
